name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend - install, import, tests, startup check
    runs-on: ubuntu-latest
    env:
      EMBED_BACKEND: hash          # offline embedder: no model download in CI
      LLM_PROVIDER: extractive     # offline generator: no API key in CI
      PYTHONHASHSEED: "42"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies (CPU torch first)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      - name: Import check
        run: python -c "import app, app.ingest, app.rag; print('import ok')"

      - name: Corpus manifest is up to date
        run: |
          python scripts/build_manifest.py
          git diff --exit-code data/manifest.json || (echo "::error::data/manifest.json is out of date. Run: python scripts/build_manifest.py and commit the result." && exit 1)

      - name: Build the vector index (strict - committed policies must match data/manifest.json)
        run: python -m app.ingest --strict

      - name: Unit, contract and smoke tests
        run: pytest -q

      - name: Startup check (gunicorn + /health + /chat + policy update)
        env:
          ADMIN_TOKEN: ci-admin-token
          POLICY_UPLOAD_DIR: /tmp/policypal-uploads
        run: |
          gunicorn app:app --bind 127.0.0.1:8000 --workers 1 --threads 2 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8000/health | python -c "import json,sys; b=json.load(sys.stdin); assert b['status']=='ok' and b['index_ready'], b; print(b)"
          curl -sf -X POST http://127.0.0.1:8000/chat -H 'Content-Type: application/json' \
            -d '{"question":"How many unused PTO days can I carry over?"}' \
            | python -c "import json,sys; b=json.load(sys.stdin); assert b['status']=='answered' and b['citations'], b; print(b['answer'])"
          # add a policy at runtime, then ask about it
          curl -sf -X POST http://127.0.0.1:8000/api/admin/policies -H "Authorization: Bearer $ADMIN_TOKEN" \
            -F "file=@examples/policy-updates/POL-13_parking_policy.md" \
            | python -c "import json,sys; b=json.load(sys.stdin); assert b['status']=='added', b; print(b['message'])"
          curl -sf -X POST http://127.0.0.1:8000/chat -H 'Content-Type: application/json' \
            -d '{"question":"How many spaces does the headquarters car park have?"}' \
            | python -c "import json,sys; b=json.load(sys.stdin); assert b['citations'][0]['document_id']=='POL-13', b; print(b['answer'])"

  frontend:
    name: Frontend - install, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  deploy:
    name: Deploy (main only, optional)
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip when no deploy target is configured
        if: env.RENDER_DEPLOY_HOOK == '' && env.RAILWAY_TOKEN == ''
        run: echo "No RENDER_DEPLOY_HOOK or RAILWAY_TOKEN secret set - skipping deploy."
      - name: Trigger Render deploy hook
        if: env.RENDER_DEPLOY_HOOK != ''
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK" > /dev/null && echo "Render deploy triggered."
      - name: Deploy with the Railway CLI
        if: env.RAILWAY_TOKEN != ''
        run: |
          npm install -g @railway/cli
          railway up --ci ${RAILWAY_SERVICE:+--service "$RAILWAY_SERVICE"}
