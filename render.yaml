# Render Blueprint for PolicyPal.
# Connect this repository in Render using New -> Blueprint.
#
# The Groq API key is not stored in this file. Render will prompt for it
# because sync is disabled for LLM_API_KEY.

services:
  - type: web
    name: policypal
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      - key: LLM_API_KEY
        sync: false

      # Enables the /admin policy-management page. Render asks for a value
      # when the Blueprint is created; leave it empty to disable admin.
      - key: ADMIN_TOKEN
        sync: false

      - key: LLM_PROVIDER
        value: groq

      - key: LLM_MODEL
        value: openai/gpt-oss-20b

      - key: LLM_TIMEOUT_S
        value: "30"

      - key: LLM_TEMPERATURE
        value: "0"

      - key: MAX_TOKENS
        value: "300"

      - key: EMBED_BACKEND
        value: onnx

      - key: EMBED_MODEL
        value: all-MiniLM-L6-v2-onnx

      - key: RERANK
        value: "0"

      - key: TOP_K
        value: "8"

      - key: TOP_N
        value: "4"

      - key: SCORE_THRESHOLD
        value: "0.30"

      - key: CHUNK_TOKENS
        value: "500"

      - key: CHUNK_OVERLAP
        value: "75"

      - key: SEED
        value: "42"

      - key: PRELOAD_PIPELINE
        value: "1"

      - key: LOG_LEVEL
        value: INFO
