# Render Blueprint: Dashboard → New → Blueprint → pick this repository.
# The API key is not stored here; Render asks for it when the Blueprint is
# created (sync: false) and keeps it as a secret environment variable.
services:
  - type: web
    name: policypal
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: LLM_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: llama-3.1-8b-instant
      - key: EMBED_BACKEND
        value: hash
      - key: RERANK
        value: "0"
      - key: SCORE_THRESHOLD
        value: "0.12"
